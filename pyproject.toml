[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-reviewer"
version = "0.2.0"
description = "Provider-agnostic, ledger-audited one-shot paper review harness with isolation by construction and recall instrumentation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Core runtime deps use bounded ranges; see ouroboros pyproject rationale:
    # exact-pinning belongs to lockfiles, upper bounds stop surprise majors.
    "httpx>=0.27,<1",
    "jsonschema>=4.21,<5",
    "pymupdf>=1.24,<2",
    "pysbd>=0.3.4,<0.4",
    "typer>=0.12,<1",
]

[project.scripts]
argus = "argus.cli:app"
argus-mcp = "argus.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "ARG002", "SIM102", "SIM105", "SIM108", "SIM117"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["argus"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network or real model backends",
]
